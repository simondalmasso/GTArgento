name: ORDER-001 Cloudflare First Deploy

on:
  push:
    branches: [order-001-deploy]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: order-001-cloudflare-first
  cancel-in-progress: true

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      E2E_BASE_URL: https://quienes-son.simondalmasso44.workers.dev
    steps:
      - name: Checkout exact deploy source
        uses: actions/checkout@v4

      - name: Materialize rig metadata probe
        run: |
          if [ -f .arq-rigmeta.py ]; then
            python .arq-rigmeta.py
            rm .arq-rigmeta.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/game.ts tests/base-preview.spec.ts .arq-rigmeta.py
            git commit -m 'order-001: expose CC0 rig metadata'
            git push origin HEAD:order-001-deploy
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript and lint gate
        run: |
          npm run typecheck
          npm run lint

      - name: Production build
        run: npm run build

      - name: Record source and bundle hashes
        run: |
          printf 'SOURCE_SHA=%s\n' "$(git rev-parse HEAD)" | tee build-evidence.txt
          printf 'BUILD_UTC=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a build-evidence.txt
          find dist -type f -print0 | sort -z | xargs -0 sha256sum | tee dist-sha256.txt
          sha256sum dist-sha256.txt | tee -a build-evidence.txt

      - name: Verify Cloudflare authorization
        run: npx wrangler whoami

      - name: Deploy required Worker
        run: npx wrangler deploy 2>&1 | tee deploy.log

      - name: Verify canonical production URL
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          for i in 1 2 3 4 5 6; do
            code=$(curl -L -sS -o production.html -w '%{http_code}' "$E2E_BASE_URL/?deploy_sha=$SOURCE_SHA" || true)
            echo "attempt=$i http=$code"
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done
          test "$code" = "200"
          grep -q 'QUIÉNES SON' production.html

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture CC0 humanoid rig probe
        run: xvfb-run -a npx playwright test tests/base-preview.spec.ts --project=desktop-chromium

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-001-cc0-rig-probe-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            build-evidence.txt
            dist-sha256.txt
            deploy.log
            production.html
            playwright-report/
            test-results/
